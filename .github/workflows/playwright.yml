name: Playwright tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC
  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag or title filter, e.g. @search. Empty runs the full suite.'
        required: false
        default: ''

# A newer run on the same branch makes the older one obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: E2E (${{ github.event_name == 'push' && 'smoke' || 'full suite' }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Repository variables override the defaults without code changes.
      BASE_URL: ${{ vars.BASE_URL || 'https://automationexercise.com' }}
      WORKERS: ${{ vars.WORKERS || '2' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run tests
        env:
          # push: smoke only. pull_request / schedule: full suite. dispatch: the given filter.
          GREP: ${{ github.event_name == 'push' && '@smoke' || inputs.grep }}
        run: npx playwright test ${GREP:+--grep "$GREP"}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces and JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Prepare report for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report/

  deploy-report:
    name: Publish report to GitHub Pages
    needs: test
    # Publish failed runs too: that is when the report matters most.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
